name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessario para publicar a release nas tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Compilar
        run: bash scripts/build.sh

      - name: Checksums
        run: cd dist && sha256sum DesignThumbs-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DesignThumbs
          path: |
            dist/DesignThumbs-*.zip
            dist/SHA256SUMS.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DesignThumbs-*.zip dist/SHA256SUMS.txt \
            --title "DesignThumbs $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --prerelease
