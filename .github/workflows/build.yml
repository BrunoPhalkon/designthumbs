name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessario para publicar a release nas tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Compilar
        run: bash scripts/build.sh

      - name: Checksums
        run: cd dist && sha256sum DesignThumbs-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DesignThumbs
          path: |
            dist/DesignThumbs-*.zip
            dist/SHA256SUMS.txt

      # Publica uma release automaticamente quando a versao em src/common.h ainda nao tem release
      - name: Publicar release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*DT_VERSION_W L"\([^"]*\)".*/\1/p' src/common.h)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe; nada a publicar."
            exit 0
          fi
          gh release create "$TAG" dist/DesignThumbs-*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "DesignThumbs $TAG" \
            --notes-file docs/RELEASE_NOTES.md --latest
